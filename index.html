<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 1 – Tailwind</title>

    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.2"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <header class="bg-green-700 text-white">
        <div class="mx-auto max-w-6xl px-6">

            <!-- LOGO + SLOGAN -->
            <div class="flex items-center justify-between py-5">

                <div>
                    <h1 class="text-xl md:text-3xl font-extrabold tracking-wide">
                        <a href="/"
                            title="Instituto Federal de Educação, Ciência e Tecnologia do Estado do Rio Grande do Norte"
                            class="no-underline">
                            INSTITUTO FEDERAL
                        </a>
                    </h1>

                    <p class="hidden md:block text-xs text-green-50">
                        Educação, Ciência, Cultura e Tecnologia em todo o Rio Grande do Norte
                    </p>
                </div>

                <!-- MENU HAMBÚRGUER (mobile) -->
                <button id="menuToggle"
                    aria-label="Menu"
                    class="md:hidden p-2 text-2xl bg-transparent">
                    <i class="ph ph-list"></i>
                </button>

                <!-- AÇÕES -->
                <div class="hidden md:flex items-center gap-2">

                    <!-- Ícones sociais -->
                    <div class="flex items-center gap-2">
                        <a href="#" aria-label="Instagram"
                            class="flex h-9 w-9 items-center justify-center rounded-full border border-white transition hover:bg-white hover:text-green-700">
                            <i class="ph ph-instagram-logo"></i>
                        </a>

                        <a href="#" aria-label="Twitter"
                            class="flex h-9 w-9 items-center justify-center rounded-full border border-white transition hover:bg-white hover:text-green-700">
                            <i class="ph ph-twitter-logo"></i>
                        </a>

                        <a href="#" aria-label="LinkedIn"
                            class="flex h-9 w-9 items-center justify-center rounded-full border border-white transition hover:bg-white hover:text-green-700">
                            <i class="ph ph-linkedin-logo"></i>
                        </a>

                        <a href="#" aria-label="YouTube"
                            class="flex h-9 w-9 items-center justify-center rounded-full border border-white transition hover:bg-white hover:text-green-700">
                            <i class="ph ph-youtube-logo"></i>
                        </a>

                        <a href="#" aria-label="Spotify"
                            class="flex h-9 w-9 items-center justify-center rounded-full border border-white transition hover:bg-white hover:text-green-700">
                            <i class="ph ph-spotify-logo"></i>
                        </a>

                        <a href="#" aria-label="TikTok"
                            class="flex h-9 w-9 items-center justify-center rounded-full border border-white transition hover:bg-white hover:text-green-700">
                            <i class="ph ph-tiktok-logo"></i>
                        </a>
                    </div>
                    
                    <!-- Busca -->
                    <form id="busca"
                        method="get"
                        action="/search/"
                        class="hidden md:flex items-center border border-gray-300 rounded-full bg-white overflow-hidden">

                        <input
                            type="search"
                            name="query"
                            placeholder="Busca"
                            aria-label="Busca"
                            class="w-28 px-3 py-2 text-sm text-gray-700 bg-transparent outline-none" />

                        <button
                            type="submit"
                            aria-label="Pesquisar"
                            class="px-3 text-gray-600 hover:text-green-700 transition">
                            <i class="ph ph-magnifying-glass"></i>
                        </button>

                    </form>

                    <!-- Alto contraste -->
                    <button id="altocontraste"
                        type="button"
                        aria-label="Alto contraste"
                        class="flex h-9 w-9 items-center justify-center rounded-full border border-white transition hover:bg-white hover:text-green-700">
                        <i class="ph ph-circle-half"></i>
                    </button>

                    <!-- Modo escuro -->
                    <button type="button"
                        aria-label="Modo escuro"
                        class="flex h-9 w-9 items-center justify-center rounded-full border border-white transition hover:bg-white hover:text-green-700">
                        <i class="ph ph-moon"></i>
                    </button>

                </div>

            </div>

            <!-- NAVEGAÇÃO PRINCIPAL -->
            <nav aria-label="Navegação principal"
                class="hidden md:block border-t border-white/25">

                <ul class="flex items-center gap-5 py-3 text-sm">
                    <li><a href="#" class="font-semibold hover:text-green-200 transition">Processos seletivos</a></li>
                    <li><a href="#" class="font-semibold hover:text-green-200 transition">Cursos</a></li>
                    <li><a href="#" class="font-semibold hover:text-green-200 transition">Campi</a></li>
                    <li><a href="#" class="font-semibold hover:text-green-200 transition">Institucional</a></li>
                    <li><a href="#" class="font-semibold hover:text-green-200 transition">Acesso à Informação</a></li>
                    <li><a href="#" class="font-semibold hover:text-green-200 transition">Eventos</a></li>
                    <li><a href="#" class="font-semibold hover:text-green-200 transition">Serviços</a></li>
                </ul>

            </nav>

        </div>
    </header>

</body>

</html>
