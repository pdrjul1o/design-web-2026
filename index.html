<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabeçalho Visual</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100 flex justify-center items-center">

    <section class="max-w-sm bg-white border rounded shadow p-4">
        
        <h1 class="text-4xl font-black text-gray-900">
            Mundo <span class="text-amber-500">Digital</span>
        </h1>

        <h2 class="mt-2 text-xl font-bold text-gray-700">
            Conheça o desenvolvimento web
        </h2>

        <p class="mt-3 text-sm font-light text-gray-500">
            Criar páginas web envolve organização, criatividade e atenção
            aos detalhes. Uma boa <span class="text-amber-500 font-bold">hierarquia</span>
            facilita a leitura e deixa o conteúdo mais agradável.
        </p>

    </section>

</body>
</html>
