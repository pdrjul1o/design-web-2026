<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card com Tailwind</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex justify-center items-center bg-gray-100">

    <section class="max-w-sm bg-white border rounded shadow p-4">

        <img
            src="https://placehold.co/400x200"
            alt="Imagem ilustrativa"
            class="w-full rounded"
        >

        <h1 class="text-2xl font-bold mt-4 mb-2">
            Cartão de Exemplo
        </h1>

        <p class="text-gray-600 mb-4">
            Um pequeno cartão desenvolvido com Tailwind CSS,
            contendo imagem, título, descrição e botão.
        </p>

        <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-700">
            Ver mais
        </button>

    </section>

</body>
</html>
